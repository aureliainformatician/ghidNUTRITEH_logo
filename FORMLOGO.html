<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutri-Tech: Story & Logo Generator</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- html2canvas for downloading element as image -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <!-- Font Inter & Orbitron -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            neon: '#00ff66',
            neonCyan: '#00f0ff',
            darkBg: '#0d1117',
            cardBg: '#161b22'
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            tech: ['Orbitron', 'sans-serif']
          }
        }
      }
    }
  </script>

  <style>
    body {
      background-color: #0d1117;
      color: #e6edf3;
      font-family: 'Inter', sans-serif;
    }

    .neon-border {
      border: 1px solid rgba(0, 255, 102, 0.4);
      transition: all 0.3s ease;
    }
    .neon-border:hover {
      border-color: #00ff66;
      box-shadow: 0 0 15px rgba(0, 255, 102, 0.3);
    }

    .glass-card {
      background: rgba(22, 27, 34, 0.95);
      backdrop-filter: blur(8px);
    }

    @keyframes pulseGlow {
      0%, 100% { box-shadow: 0 0 15px rgba(0, 255, 102, 0.4); }
      50% { box-shadow: 0 0 25px rgba(0, 240, 255, 0.6); }
    }
    .badge-glow {
      animation: pulseGlow 3s infinite ease-in-out;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

  <!-- Language Switcher Bar -->
  <div class="w-full max-w-xl flex justify-between items-center mb-6">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-lg bg-neon/10 border border-neon flex items-center justify-center text-neon">
        <i data-lucide="zap" class="w-5 h-5"></i>
      </div>
      <span class="font-tech text-neon font-bold text-lg">NutriTeh Cyber Lab</span>
    </div>

    <!-- Toggle Buttons -->
    <div class="bg-cardBg border border-gray-700 p-1 rounded-xl flex items-center gap-1">
      <button id="btn-en" onclick="setLanguage('en')" class="px-3 py-1 rounded-lg text-xs font-bold transition bg-neon text-darkBg">
        🇬🇧 EN
      </button>
      <button id="btn-ro" onclick="setLanguage('ro')" class="px-3 py-1 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white">
        🇷🇴 RO
      </button>
    </div>
  </div>

  <!-- Main Container -->
  <main class="w-full max-w-xl glass-card rounded-2xl p-6 md:p-8 neon-border space-y-6">

    <!-- Header Title -->
    <div class="text-center space-y-2">
      <h1 class="text-2xl md:text-3xl font-tech font-extrabold text-neon tracking-wide flex items-center justify-center gap-2">
        <span>🥦</span> <span data-i18n="title">Nutri-Tech: My Story & Logo</span>
      </h1>
      <p class="text-xs text-gray-400" data-i18n="subtitle">
        Write your story, design your custom AI logo preview card, and download it as JPG!
      </p>
    </div>

    <!-- Form -->
    <form id="logoForm" onsubmit="generateLogoConcept(event)" class="space-y-4">
      
      <!-- Field 1: Name -->
      <div>
        <label for="studentName" class="block text-xs font-tech text-neonCyan uppercase mb-1" data-i18n="labelName">
          Student First Name:
        </label>
        <input 
          type="text" 
          id="studentName" 
          placeholder="e.g., Andrew / Andrei" 
          required 
          class="w-full px-4 py-2.5 bg-darkBg rounded-xl border border-gray-700 focus:border-neon focus:ring-1 focus:ring-neon outline-none text-white text-sm transition"
        >
      </div>

      <!-- Field 2: Concept -->
      <div>
        <label for="conceptLearned" class="block text-xs font-tech text-neonCyan uppercase mb-1" data-i18n="labelConcept">
          Concept learned from guide:
        </label>
        <input 
          type="text" 
          id="conceptLearned" 
          placeholder="e.g., Playful Calorie / Menemen / Smart Protein" 
          required 
          class="w-full px-4 py-2.5 bg-darkBg rounded-xl border border-gray-700 focus:border-neon focus:ring-1 focus:ring-neon outline-none text-white text-sm transition"
        >
      </div>

      <!-- Field 3: Story -->
      <div>
        <label for="storyText" class="block text-xs font-tech text-neonCyan uppercase mb-1" data-i18n="labelStory">
          Funny story / description:
        </label>
        <textarea 
          id="storyText" 
          rows="3" 
          placeholder="Once upon a time, a calorie was running across the plate towards a nutritionist robot..." 
          required 
          class="w-full px-4 py-2.5 bg-darkBg rounded-xl border border-gray-700 focus:border-neon focus:ring-1 focus:ring-neon outline-none text-white text-sm resize-none transition"
        ></textarea>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full py-3.5 px-4 bg-neon hover:bg-neonBright text-darkBg font-tech font-bold rounded-xl shadow-lg transition transform active:scale-[0.99] flex items-center justify-center gap-2 text-sm uppercase tracking-wider"
      >
        <i data-lucide="sparkles" class="w-5 h-5"></i>
        <span data-i18n="btnGenerate">Generate Logo & Story Card</span>
      </button>
    </form>

    <!-- Logo Result Card Container -->
    <div id="resultWrapper" class="hidden space-y-4 pt-4 border-t border-gray-800">
      
      <!-- Target Element to Export (Clean styling for HTML2Canvas render) -->
      <div id="exportableLogoCard" class="bg-gradient-to-br from-[#161b22] to-[#0d1117] border-2 border-[#00ff66] rounded-2xl p-6 text-white space-y-4 relative shadow-2xl">
        
        <!-- Header Info -->
        <div class="flex items-center justify-between border-b border-gray-800 pb-3">
          <div class="flex items-center gap-2">
            <span class="w-3 h-3 rounded-full bg-[#00ff66] inline-block"></span>
            <span class="font-tech font-bold text-sm text-[#00ff66]" id="resStudent">Student Name</span>
          </div>
          <span class="text-xs bg-[#00f0ff]/10 text-[#00f0ff] border border-[#00f0ff]/30 font-semibold px-3 py-1 rounded-full font-tech" id="resConcept">
            Concept
          </span>
        </div>

        <!-- Story Quote -->
        <p class="text-xs text-gray-300 italic bg-black/40 p-3 rounded-xl border border-gray-800 leading-relaxed" id="resStory">
          "Story text..."
        </p>

        <!-- Visual AI Cyber Badge -->
        <div class="bg-black/60 p-5 rounded-xl border border-[#00ff66]/40 flex flex-col items-center justify-center text-center space-y-3 shadow-inner">
          <div class="w-20 h-20 rounded-2xl bg-gradient-to-tr from-[#00ff66] to-[#00f0ff] text-darkBg flex items-center justify-center text-4xl shadow-lg border-2 border-white badge-glow">
            🤖
          </div>
          <div class="font-tech font-black text-lg text-white uppercase tracking-wider" id="logoTextPreview">
            NUTRITECH LOGO
          </div>
          <div class="text-[11px] text-[#00ff66] font-tech uppercase tracking-widest">
            OFFICIAL CERTIFIED LOGO CONCEPT • NUTRI-TECH LABS
          </div>
        </div>

        <!-- Watermark Footer -->
        <div class="flex justify-between items-center text-[10px] text-gray-500 font-mono pt-2 border-t border-gray-800/60">
          <span>PROJECT: NUTRITECH CLASA V-A / HS</span>
          <span id="cardTimestamp">2026-10-21</span>
        </div>
      </div>

      <!-- Action Button to Download JPG -->
      <button 
        onclick="downloadLogoJpg()" 
        class="w-full py-3 px-4 bg-neonCyan hover:bg-white text-darkBg font-tech font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm uppercase tracking-wider"
      >
        <i data-lucide="download" class="w-5 h-5"></i>
        <span data-i18n="btnDownload">Download Logo Card (.JPG)</span>
      </button>

    </div>

  </main>

  <script>
    // Internationalization (i18n) Translations
    const translations = {
      en: {
        title: "Nutri-Tech: My Story & Logo",
        subtitle: "Write your story, design your custom AI logo preview card, and download it as JPG!",
        labelName: "Student First Name:",
        labelConcept: "Concept learned from guide:",
        labelStory: "Funny story / description:",
        btnGenerate: "Generate Logo & Story Card",
        btnDownload: "Download Logo Card (.JPG)",
        resPrefixStudent: "STUDENT: ",
        placeholderName: "e.g., Andrew",
        placeholderConcept: "e.g., Playful Calorie / Smart Proteins",
        placeholderStory: "Once upon a time, a calorie was running across the plate towards a nutritionist robot..."
      },
      ro: {
        title: "Nutri-Tech: Povestea & Logo-ul Meu",
        subtitle: "Scrie povestea ta, generează cardul de prezentare a logo-ului și descarcă-l în format JPG!",
        labelName: "Prenume Elev:",
        labelConcept: "Concept învățat din ghid:",
        labelStory: "Poveste amuzantă / descriere:",
        btnGenerate: "Generează Logo & Card Poveste",
        btnDownload: "Descarcă Card Logo (.JPG)",
        resPrefixStudent: "ELEV: ",
        placeholderName: "ex: Andrei / Elena",
        placeholderConcept: "ex: Calorie Jucăușă / Proteine Inteligente",
        placeholderStory: "A fost odată ca niciodată o calorie care alerga pe farfurie spre un robot nutriționist..."
      }
    };

    let currentLang = 'en';

    function setLanguage(lang) {
      currentLang = lang;
      
      // Update toggle buttons active style
      document.getElementById('btn-en').className = lang === 'en' 
        ? "px-3 py-1 rounded-lg text-xs font-bold transition bg-neon text-darkBg"
        : "px-3 py-1 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white";

      document.getElementById('btn-ro').className = lang === 'ro' 
        ? "px-3 py-1 rounded-lg text-xs font-bold transition bg-neon text-darkBg"
        : "px-3 py-1 rounded-lg text-xs font-bold transition text-gray-400 hover:text-white";

      // Translate text content
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang][key]) {
          el.innerText = translations[lang][key];
        }
      });

      // Translate placeholders
      document.getElementById('studentName').placeholder = translations[lang].placeholderName;
      document.getElementById('conceptLearned').placeholder = translations[lang].placeholderConcept;
      document.getElementById('storyText').placeholder = translations[lang].placeholderStory;

      // Update existing result card if visible
      const nameVal = document.getElementById('studentName').value.trim();
      if(nameVal) {
        document.getElementById('resStudent').innerText = translations[lang].resPrefixStudent + nameVal.toUpperCase();
      }
    }

    function generateLogoConcept(e) {
      e.preventDefault();

      const name = document.getElementById('studentName').value.trim();
      const concept = document.getElementById('conceptLearned').value.trim();
      const story = document.getElementById('storyText').value.trim();

      document.getElementById('resStudent').innerText = translations[currentLang].resPrefixStudent + name.toUpperCase();
      document.getElementById('resConcept').innerText = concept;
      document.getElementById('resStory').innerText = `"${story}"`;
      document.getElementById('logoTextPreview').innerText = "NUTRI-TECH: " + concept.toUpperCase();
      
      // Set current date
      const today = new Date().toISOString().split('T')[0];
      document.getElementById('cardTimestamp').innerText = `DATE: ${today}`;

      // Reveal card
      document.getElementById('resultWrapper').classList.remove('hidden');
      
      // Smooth scroll to card
      document.getElementById('resultWrapper').scrollIntoView({ behavior: 'smooth' });
    }

    function downloadLogoJpg() {
      const cardElement = document.getElementById('exportableLogoCard');
      const studentName = document.getElementById('studentName').value.trim() || 'student';

      // Use html2canvas to render card into a high quality image canvas
      html2canvas(cardElement, {
        backgroundColor: '#0d1117',
        scale: 2 // High DPI quality
      }).then(canvas => {
        // Convert canvas to JPG data URL
        const imgData = canvas.toDataURL('image/jpeg', 0.95);

        // Trigger browser download via anchor element
        const downloadLink = document.createElement('a');
        downloadLink.href = imgData;
        downloadLink.download = `NutriTech_Logo_${studentName.replace(/\s+/g, '_')}.jpg`;
        document.body.appendChild(downloadLink);
        downloadLink.click();
        document.body.removeChild(downloadLink);
      });
    }

    window.onload = function() {
      lucide.createIcons();
    };
  </script>
</body>
</html>
