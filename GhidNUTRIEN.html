<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nutri-Tech: My Story & Logo</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      background-color: #f3f4f6;
      font-family: system-ui, -apple-system, sans-serif;
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

  <div class="max-w-xl w-full bg-white rounded-2xl shadow-xl border border-emerald-100 p-6 md:p-8 space-y-6">
    
    <!-- Title -->
    <div class="text-center space-y-1">
      <h1 class="text-2xl font-extrabold text-emerald-800 flex items-center justify-center gap-2">
        <span>🥦</span> Nutri-Tech: My Story & Logo
      </h1>
      <p class="text-xs text-gray-500">Create your story and generate your logo idea for the project!</p>
    </div>

    <!-- Interactive Form -->
    <form id="logoForm" onsubmit="generateLogoConcept(event)" class="space-y-4">
      
      <!-- Field 1: Student First Name -->
      <div>
        <label for="studentName" class="block text-sm font-bold text-gray-700 mb-1">
          Student First Name:
        </label>
        <input 
          type="text" 
          id="studentName" 
          placeholder="e.g., Andrew" 
          required 
          class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition text-gray-800 text-sm"
        >
      </div>

      <!-- Field 2: Concept Learned -->
      <div>
        <label for="conceptLearned" class="block text-sm font-bold text-gray-700 mb-1">
          Concept learned from the guide:
        </label>
        <input 
          type="text" 
          id="conceptLearned" 
          placeholder="e.g., Playful Calorie / Smart Proteins / Menemen" 
          required 
          class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition text-gray-800 text-sm"
        >
      </div>

      <!-- Field 3: Funny Story -->
      <div>
        <label for="storyText" class="block text-sm font-bold text-gray-700 mb-1">
          Funny story (corrected by teacher):
        </label>
        <textarea 
          id="storyText" 
          rows="3" 
          placeholder="Once upon a time, a calorie was running across the plate towards a nutritionist robot..." 
          required 
          class="w-full px-4 py-2.5 rounded-xl border border-gray-300 focus:border-emerald-500 focus:ring-2 focus:ring-emerald-200 outline-none transition text-gray-800 text-sm resize-none"
        ></textarea>
      </div>

      <!-- Submit Button -->
      <button 
        type="submit" 
        class="w-full py-3 px-4 bg-emerald-700 hover:bg-emerald-800 text-white font-bold rounded-xl shadow-lg hover:shadow-xl transition transform active:scale-[0.99] flex items-center justify-center gap-2 text-sm"
      >
        <span>✨</span> Generate my Logo with AI
      </button>
    </form>

    <!-- Preview / Result Area -->
    <div id="resultCard" class="hidden bg-emerald-50 border border-emerald-200 rounded-xl p-5 space-y-3">
      <div class="flex items-center justify-between border-b border-emerald-200 pb-2">
        <span class="font-bold text-emerald-900 text-sm" id="resStudent">Logo by ...</span>
        <span class="text-xs bg-emerald-200 text-emerald-800 font-semibold px-2.5 py-0.5 rounded-full" id="resConcept">Concept</span>
      </div>
      
      <p class="text-xs text-gray-600 italic" id="resStory">"Story..."</p>
      
      <!-- Visual AI Logo Preview Simulation -->
      <div class="bg-white p-4 rounded-xl border border-emerald-300 flex flex-col items-center justify-center text-center space-y-2 shadow-inner">
        <div class="w-20 h-20 rounded-full bg-emerald-600 text-white flex items-center justify-center text-3xl shadow-md border-2 border-emerald-400 animate-bounce">
          <i class="fa-solid fa-robot"></i>
        </div>
        <div class="font-black text-emerald-900 text-lg uppercase tracking-wider" id="logoTextPreview">
          NUTRITECH LOGO
        </div>
        <p class="text-[11px] text-emerald-700 font-medium">Concept successfully created based on your story!</p>
      </div>
    </div>

  </div>

  <script>
    function generateLogoConcept(e) {
      e.preventDefault();
      
      const name = document.getElementById('studentName').value.trim();
      const concept = document.getElementById('conceptLearned').value.trim();
      const story = document.getElementById('storyText').value.trim();

      document.getElementById('resStudent').innerText = "Logo Concept: " + name;
      document.getElementById('resConcept').innerText = concept;
      document.getElementById('resStory').innerText = '"' + story + '"';
      document.getElementById('logoTextPreview').innerText = "NUTRI-TECH: " + concept.toUpperCase();

      document.getElementById('resultCard').classList.remove('hidden');
    }
  </script>
</body>
</html>
